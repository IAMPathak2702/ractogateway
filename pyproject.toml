[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ractogateway"
dynamic = ["version"]
description = "A unified, production-ready AI SDK that enforces structured outputs and anti-hallucination prompting via the RACTO principle. One package for OpenAI, Gemini, and Anthropic — with streaming, tool calling, embeddings, and strict Pydantic validation."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Ved Prakash Pathak", email = "vp.ved.vpp@gmail.com" },
]
maintainers = [
    { name = "Ved Prakash Pathak", email = "vp.ved.vpp@gmail.com" },
]
keywords = [
    "ai",
    "llm",
    "openai",
    "gemini",
    "anthropic",
    "claude",
    "gpt",
    "structured-output",
    "prompt-engineering",
    "racto",
    "anti-hallucination",
    "function-calling",
    "tool-use",
    "streaming",
    "embeddings",
    "pydantic",
    "sdk",
    "gateway",
    "unified-api",
    "developer-kit",
    "rag",
    "retrieval-augmented-generation",
    "vector-database",
    "chromadb",
    "faiss",
    "pinecone",
    "qdrant",
    "weaviate",
    "milvus",
    "pgvector",
    "voyage-ai",
    "chunking",
    "document-parsing",
    "mcp",
    "model-context-protocol",
    "claude-desktop",
    "tool-server",
    "agentic",
    "ollama",
    "local-llm",
    "huggingface",
    "huggingface-hub",
    "text-generation-inference",
    "tgi",
    "vllm",
    "local-model",
    "offline-inference",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
# ── LLM providers ────────────────────────────────────────────────────────────
openai = ["openai>=1.0,<3.0"]
google = ["google-genai>=1.0,<2.0"]
anthropic = ["anthropic>=0.40,<1.0"]
# Local / self-hosted model inference
ollama = ["ollama>=0.3,<1.0"]
huggingface = ["huggingface_hub>=0.23,<2.0"]
all = [
    "ractogateway[openai]",
    "ractogateway[google]",
    "ractogateway[anthropic]",
    "ractogateway[ollama]",
    "ractogateway[huggingface]",
]

# ── RAG OCR backends (each optional) ─────────────────────────────────────────
# pip install ractogateway[rag-ocr-tesseract]  — free, offline Tesseract OCR
# pip install ractogateway[rag-ocr-easy]       — EasyOCR, deep-learning, offline
# pip install ractogateway[rag-ocr-google]     — Google Vision + Document AI
# pip install ractogateway[rag-ocr-aws]        — AWS Textract
# pip install ractogateway[rag-ocr-azure]      — Azure Document Intelligence
# pip install ractogateway[rag-ocr-pdf]        — pdf2image (needed for any OCR on PDFs)
rag-ocr-pdf       = ["pdf2image>=1.16,<2.0", "pillow>=10.0,<12.0"]
rag-ocr-tesseract = ["pytesseract>=0.3,<1.0", "pillow>=10.0,<12.0", "pdf2image>=1.16,<2.0"]
rag-ocr-easy      = ["easyocr>=1.7,<2.0", "pillow>=10.0,<12.0", "pdf2image>=1.16,<2.0"]
rag-ocr-google    = [
    "google-cloud-vision>=3.0,<4.0",
    "google-cloud-documentai>=2.0,<3.0",
    "pdf2image>=1.16,<2.0",
    "pillow>=10.0,<12.0",
]
rag-ocr-aws       = ["boto3>=1.26,<2.0", "pdf2image>=1.16,<2.0", "pillow>=10.0,<12.0"]
rag-ocr-azure     = [
    "azure-ai-documentintelligence>=1.0,<2.0",
    "pdf2image>=1.16,<2.0",
    "pillow>=10.0,<12.0",
]

# ── RAG file readers (each optional) ─────────────────────────────────────────
rag-pdf     = ["pypdf>=4.0,<6.0"]
rag-word    = ["python-docx>=1.1,<2.0"]
rag-excel   = ["openpyxl>=3.1,<4.0"]
rag-image   = ["pillow>=10.0,<12.0"]
rag-nlp     = ["nltk>=3.8,<4.0"]
rag-readers = [
    "ractogateway[rag-pdf]",
    "ractogateway[rag-word]",
    "ractogateway[rag-excel]",
    "ractogateway[rag-image]",
]

# ── RAG vector stores (each optional) ────────────────────────────────────────
rag-chroma   = ["chromadb>=0.5,<2.0"]
rag-faiss    = ["faiss-cpu>=1.7,<2.0", "numpy>=1.24,<3.0"]
rag-pinecone = ["pinecone-client>=3.0,<5.0"]
rag-qdrant   = ["qdrant-client>=1.9,<2.0"]
rag-weaviate = ["weaviate-client>=4.6,<5.0"]
rag-milvus   = ["pymilvus>=2.4,<3.0"]
rag-pgvector = ["psycopg2-binary>=2.9,<3.0", "pgvector>=0.3,<1.0"]

# ── RAG embedding providers ───────────────────────────────────────────────────
rag-voyage = ["voyageai>=0.2,<2.0"]

# ── Convenience bundles ───────────────────────────────────────────────────────
rag-ocr-all = [
    "ractogateway[rag-ocr-tesseract]",
    "ractogateway[rag-ocr-easy]",
]
# Minimal RAG (in-memory store, text+pdf+html readers, clean+lemmatize)
rag = [
    "ractogateway[rag-readers]",
    "ractogateway[rag-nlp]",
]
# Everything RAG
rag-all = [
    "ractogateway[rag]",
    "ractogateway[rag-chroma]",
    "ractogateway[rag-faiss]",
    "ractogateway[rag-pinecone]",
    "ractogateway[rag-qdrant]",
    "ractogateway[rag-weaviate]",
    "ractogateway[rag-milvus]",
    "ractogateway[rag-pgvector]",
    "ractogateway[rag-voyage]",
]

# ── MCP (Model Context Protocol) ─────────────────────────────────────────────
# Core: stdio + SSE client transport.
mcp     = ["mcp>=1.0,<2.0"]
# Server SSE transport: requires starlette ASGI framework + uvicorn web server.
mcp-sse = ["mcp>=1.0,<2.0", "starlette>=0.41,<1.0", "uvicorn>=0.32,<1.0"]

# ── Performance / cost-optimisation (optional) ────────────────────────────────
# tiktoken enables exact token counting in TokenTruncator (OpenAI models).
# Without it, the built-in len//4 approximation is used automatically.
cache = ["tiktoken>=0.7,<1.0"]

# ── Redis infrastructure (optional) ───────────────────────────────────────────
# Distributed exact-match cache, token-bucket rate limiter, and sliding-window
# chat memory — all backed by a shared Redis instance.
redis = ["redis>=5.0,<6.0"]

# ── Celery task queue (optional) ──────────────────────────────────────────────
# Background document ingestion, never-fail LLM retries, parallel batch inference.
celery = ["celery>=5.3,<6.0"]
kafka = ["kafka-python>=2.0,<3.0"]

# ── Observability (optional) ───────────────────────────────────────────────────
# OpenTelemetry tracing — spans per LLM call, OTLP gRPC/HTTP export (Jaeger, Tempo, etc.)
telemetry = [
    "opentelemetry-sdk>=1.20,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20,<2.0",
]
# Prometheus metrics — 7 labelled metrics, /metrics HTTP endpoint
prometheus = ["prometheus-client>=0.19,<1.0"]
# Both tracing and metrics
observability = [
    "ractogateway[telemetry]",
    "ractogateway[prometheus]",
]

# ── Prebuilt pipelines (optional) ─────────────────────────────────────────────
# Real-world end-to-end LLM pipeline patterns.
# Each extra pulls in only the dependencies needed for that pipeline.
#
# pip install ractogateway[pipelines-sql]        — NL-to-SQL + pandas + answer
# pip install ractogateway[pipelines-sql-viz]    — above + Plotly charts
# pip install ractogateway[pipelines-sql-polars] — NL-to-SQL + Polars (fast, no pandas needed)
# pip install ractogateway[pipelines-classifier]           — List Classifier (no extra deps)
# pip install ractogateway[pipelines-video]                — VideoProcessor core
# pip install ractogateway[pipelines-video-whisper]        — + faster-whisper (local ASR)
# pip install ractogateway[pipelines-video-openai-whisper] — + openai-whisper (local ASR)
# pip install ractogateway[pipelines-video-yt]             — + yt-dlp (YouTube download)
# pip install ractogateway[pipelines-video-full]           — video core + whisper + yt-dlp
# pip install ractogateway[pipelines-agent]                — AgentPipeline (no extra deps)
# pip install ractogateway[pipelines-agent-http]           — AgentPipeline + http_get tool
# pip install ractogateway[pipelines]                      — all pipelines bundled
pipelines-sql = ["sqlalchemy>=2.0,<3.0", "pandas>=2.0,<3.0"]
pipelines-sql-viz = [
    "sqlalchemy>=2.0,<3.0",
    "pandas>=2.0,<3.0",
    "plotly>=5.0,<7.0",
]
pipelines-sql-polars = ["sqlalchemy>=2.0,<3.0", "polars>=0.20,<2.0"]
# List Classifier needs no extra deps — ships with every ractogateway install.
pipelines-classifier = []
# Agent Pipeline — no extra deps for core; httpx needed for the http_get tool
pipelines-agent = []
pipelines-agent-http = ["httpx>=0.27,<1.0"]
# Video Processor — frame extraction, dedup, audio extraction, vision analysis
pipelines-video = [
    "opencv-python>=4.8,<5.0",
    "imagehash>=4.3,<5.0",
    "pillow>=10.0,<12.0",
    "ffmpeg-python>=0.2,<1.0",
    "scikit-image>=0.22,<2.0",
    "numpy>=1.24,<3.0",
    "httpx>=0.27,<1.0",
]
# Audio transcription backends (choose one or more)
pipelines-video-whisper = ["faster-whisper>=1.0,<2.0"]
pipelines-video-openai-whisper = ["openai-whisper>=20230918"]
# YouTube download support via yt-dlp
pipelines-video-yt = ["yt-dlp>=2024.1.1"]
# Full video bundle: core + faster-whisper + YouTube
pipelines-video-full = [
    "ractogateway[pipelines-video]",
    "ractogateway[pipelines-video-whisper]",
    "ractogateway[pipelines-video-yt]",
]
pipelines = [
    "ractogateway[pipelines-sql]",
    "ractogateway[pipelines-classifier]",
    "ractogateway[pipelines-video]",
    "ractogateway[pipelines-agent]",
]

dev = [
    "ractogateway[all]",
    "ractogateway[rag]",
    "ractogateway[cache]",
    "ractogateway[redis]",
    "ractogateway[celery]",
    "ractogateway[kafka]",
    "ractogateway[mcp]",
    "ractogateway[observability]",
    "ractogateway[pipelines-sql-viz]",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    # local-model extras for development
    "ollama>=0.3,<1.0",
    "huggingface_hub>=0.23,<2.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=3.0",
]

[project.urls]
Homepage = "https://github.com/IAMPathak2702/RactoGateway"
Documentation = "https://ractogateway.readthedocs.io"
Repository = "https://github.com/IAMPathak2702/RactoGateway"
Issues = "https://github.com/IAMPathak2702/RactoGateway/issues"
Changelog = "https://github.com/IAMPathak2702/RactoGateway/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/ractogateway/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ractogateway"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ractogateway",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py310"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit (security)
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
    "PL",   # pylint
]
ignore = [
    "S101",    # assert used in tests is fine
    "PLR0913", # too many arguments — unavoidable in SDK design
    "E402",    # lazy optional-dependency guards intentionally precede some imports
    "RUF022",  # __all__ lists are grouped semantically, not alphabetically
    "TC001",   # runtime imports needed by Pydantic model fields
    "TC002",   # runtime third-party imports needed by Pydantic model fields
    "TC003",   # runtime stdlib imports needed by Pydantic model fields
    "PLC0415", # intentional lazy provider imports inside _require_xxx() functions
]

[tool.ruff.lint.isort]
known-first-party = ["ractogateway"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]
"src/ractogateway/prompts/engine.py" = ["E501"]               # guardrail strings intentionally verbose
"src/ractogateway/tools/registry.py" = ["PLR2004"]            # magic length constant is self-documenting
# Middleware pipeline in each kit: cache + routing + tracing logic exceeds pylint branch/statement limits by design
"src/ractogateway/anthropic_developer_kit/kit.py" = ["PLR0911", "PLR0912", "PLR0915"]
"src/ractogateway/google_developer_kit/kit.py" = ["PLR0912", "PLR0915"]
"src/ractogateway/openai_developer_kit/kit.py" = ["PLR0912", "PLR0915"]
"src/ractogateway/rag/stores/faiss_store.py" = ["S301", "S403"] # pickle used for local persistence
"src/ractogateway/rag/stores/pgvector_store.py" = ["S608"]    # SQL string formatting is parameterised
"src/ractogateway/rag/chunkers/recursive_chunker.py" = ["PLR0912"] # chunking algorithm needs branching
# Batch processors: JSON parsing in result loop, long line URLs in JSONL body
"src/ractogateway/batch/openai_batch.py" = ["S603", "PLR0912", "E501"]
"src/ractogateway/batch/anthropic_batch.py" = ["PLR0911", "PLR0912"]
# Local-model kits: streaming state machines have >6 return paths; lazy imports
"src/ractogateway/ollama_developer_kit/kit.py" = ["PLR0911", "PLR0912", "PLR0915"]
"src/ractogateway/ollama_developer_kit/server.py" = ["S603"]  # subprocess calls are intentional (managed ollama binary)
"src/ractogateway/huggingface_developer_kit/kit.py" = ["PLR0911", "PLR0912", "PLR0915"]
"src/ractogateway/adapters/ollama_kit.py" = ["PLC0415"]
"src/ractogateway/adapters/huggingface_kit.py" = ["PLC0415"]
# Redis: 5-param signatures mirror ExactMatchCache; SCAN-based clear is intentional
"src/ractogateway/redis/exact_cache.py" = ["PLR0913"]
# Celery: worker registers dynamic tasks via closures; BLE001 for broad except in wait()
"src/ractogateway/celery/worker.py" = ["PLR0913", "BLE001"]
# MCP: agentic loop branches; SLF001 for intentional private-attr access within package
"src/ractogateway/mcp/agent.py" = ["PLR0912", "BLE001"]
"src/ractogateway/mcp/multi_client.py" = ["PLR0912"]
"src/ractogateway/mcp/client.py" = ["SLF001"]
"src/ractogateway/mcp/server.py" = ["SLF001"]
# Telemetry: S106 false-positive on "token_type" label arg; N806 handled by renaming
"src/ractogateway/telemetry/metrics.py" = ["S106"]
# Package __init__ collects a large TYPE_CHECKING import surface for re-exports.
"src/ractogateway/__init__.py" = ["I001"]
# Prebuilt pipelines are currently under active development.
"src/ractogateway/pipelines/list_classifier/pipeline.py" = [
    "B905",
    "C408",
    "E501",
    "F401",
    "PLR0912",
    "PLR0915",
    "RUF001",
    "RUF002",
    "RUF100",
    "S110",
    "SIM105",
    "UP037",
]
# Telemetry tests use local inline imports and runtime-only symbols by design.
"tests/test_telemetry.py" = ["E501", "F821", "I001", "UP037"]
# Sphinx config and SQL pipeline internals are WIP and intentionally permissive.
"docs/conf.py" = ["I001"]
"src/ractogateway/pipelines/sql_analyst/_models.py" = ["RUF100"]
"src/ractogateway/pipelines/sql_analyst/_schema.py" = [
    "E501",
    "PLR0912",
    "PLR0915",
    "RUF100",
    "S110",
    "S608",
]
"src/ractogateway/pipelines/sql_analyst/_viz.py" = [
    "I001",
    "PLR0911",
    "PLR2004",
    "RUF100",
]
"src/ractogateway/pipelines/sql_analyst/pipeline.py" = [
    "B905",
    "E501",
    "RUF100",
    "S110",
]
# Video Processor pipeline — complex async/sync concurrency + many-branch dispatch
"src/ractogateway/pipelines/video_processor/pipeline.py" = [
    "B905",
    "E501",
    "PLR0912",
    "PLR0915",
    "RUF100",
]
"src/ractogateway/pipelines/video_processor/_extractor.py" = [
    "E501",
    "PLR0912",
    "PLR0915",
    "S603",
]
"src/ractogateway/pipelines/video_processor/_transcriber.py" = [
    "E501",
    "PLR0911",
    "PLR0912",
    "RUF100",
    "S110",
]
"src/ractogateway/pipelines/video_processor/_analyzer.py" = [
    "E501",
    "PLR0912",
    "RUF100",
    "S110",
]
"src/ractogateway/pipelines/video_processor/_summarizer.py" = ["E501", "RUF100"]
"src/ractogateway/pipelines/video_processor/_rag.py" = ["E501", "S110"]
"src/ractogateway/pipelines/video_processor/_loader.py" = ["E501", "S108"]
# Agent Pipeline — broad BLE001/S110 used intentionally for tool execution safety net
"src/ractogateway/pipelines/agent/_executor.py" = ["BLE001"]
"src/ractogateway/pipelines/agent/pipeline.py" = ["BLE001", "E501", "S110"]
"tests/test_agent_pipeline.py" = [
    "E501",
    "PLR2004",
    "S101",
    "I001",
]
"tests/test_video_processor.py" = [
    "E501",
    "PLR2004",
    "S101",
    "I001",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "openai.*",
    "google.*",
    "anthropic.*",
    # RAG optional deps
    "pypdf.*",
    "docx.*",
    "openpyxl.*",
    "PIL.*",
    "nltk.*",
    # Pipelines optional deps
    "sqlalchemy.*",
    "pandas.*",
    "polars.*",
    "plotly.*",
    "chromadb.*",
    "faiss.*",
    "pinecone.*",
    "qdrant_client.*",
    "weaviate.*",
    "pymilvus.*",
    "psycopg2.*",
    "pgvector.*",
    "voyageai.*",
    "numpy.*",
    # Performance extras
    "tiktoken.*",
    # Redis infrastructure
    "redis.*",
    # Celery task queue
    "celery.*",
    "kombu.*",
    # Kafka event streaming
    "kafka.*",
    # Local-model inference providers
    "ollama.*",
    "huggingface_hub.*",
    # MCP
    "mcp.*",
    "starlette.*",
    "uvicorn.*",
    # Observability
    "opentelemetry.*",
    "prometheus_client.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "ractogateway.pipelines.list_classifier.*",
    "ractogateway.pipelines.sql_analyst.*",
    "ractogateway.pipelines.video_processor.*",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require API keys",
]

[tool.coverage.run]
source = ["ractogateway._models"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
