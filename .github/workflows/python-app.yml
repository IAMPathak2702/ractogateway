name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true   # cancel older runs on the same branch/PR

jobs:
  # ── Lint & Format ────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install --upgrade ruff

      - name: Check code style (ruff format)
        run: ruff format --check src/ tests/

      - name: Lint (ruff check)
        run: ruff check src/ tests/

  # ── Type check ───────────────────────────────────────────────────────────────
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with all extras + mypy
        run: pip install -e ".[all]" mypy

      - name: Run mypy
        run: mypy src/

  # ── Tests (matrix) ───────────────────────────────────────────────────────────
  test:
    name: Test — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [lint]   # don't waste minutes on broken formatting

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package in dev mode
        # Installs the project + all providers + pytest + ruff + mypy + coverage
        run: pip install -e ".[dev]" pytest-cov

      - name: Run unit tests (skip integration tests — no API keys in CI)
        run: |
          pytest tests/ \
            -m "not integration" \
            --tb=short \
            --cov=ractogateway \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80

      - name: Upload coverage report
        if: matrix.python-version == '3.12'   # upload once, not 4×
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ── Build check ──────────────────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions with twine
        run: |
          pip install twine
          twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
