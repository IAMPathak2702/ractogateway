# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Build the docs with Sphinx
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# Install the package with the [docs] extra so Sphinx extensions are available
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
